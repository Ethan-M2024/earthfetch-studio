name: Windows launcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copy the app the way a PM gets it (release zip contents only)
        shell: pwsh
        run: |
          git archive --format=zip --prefix=earthfetch-studio/ -o "$env:RUNNER_TEMP\studio.zip" HEAD
          Expand-Archive "$env:RUNNER_TEMP\studio.zip" "$env:USERPROFILE\Desktop\PM Downloads (1)"
          Get-ChildItem "$env:USERPROFILE\Desktop\PM Downloads (1)\earthfetch-studio" | Format-Table Name
      - name: Double-click Start Studio.bat (first run does setup)
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\Desktop\PM Downloads (1)\earthfetch-studio"
          # launch the .bat itself, the way Explorer does on double-click
          $p = Start-Process -FilePath "$dir\Start Studio.bat" -WorkingDirectory $dir -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\launcher.log" -RedirectStandardError "$env:RUNNER_TEMP\launcher.err"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalMinutes -lt 15) {
            try { if ((Invoke-WebRequest http://localhost:7860/api/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { break } } catch {}
            if ($p.HasExited) { Get-Content "$env:RUNNER_TEMP\launcher.log", "$env:RUNNER_TEMP\launcher.err" -ErrorAction SilentlyContinue; throw "launcher exited early" }
            Start-Sleep 3
          }
          Write-Host "ready after $([int]$sw.Elapsed.TotalSeconds)s"
          Get-Content "$env:RUNNER_TEMP\launcher.log"
          Invoke-RestMethod http://localhost:7860/api/health
          (Get-ChildItem "$dir\.venv\Scripts\python.exe").FullName
      - name: The page loads
        shell: pwsh
        run: |
          $html = (Invoke-WebRequest http://localhost:7860/ -UseBasicParsing).Content
          if ($html -notmatch 'Download package for your analyst') { throw "page did not load" }
          (Invoke-WebRequest http://localhost:7860/static/studio.js -UseBasicParsing).StatusCode
      - name: Make a map and an analyst package
        shell: pwsh
        run: |
          $body = '{"product":"terrain","bbox":[-121.75,45.35,-121.65,45.40],"options":{}}'
          $r = Invoke-RestMethod http://localhost:7860/api/render -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 300
          Write-Host "map: $($r.title) in $($r.seconds)s"
          $fc = '{"type":"FeatureCollection","features":[{"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[-121.7,45.36],[-121.69,45.36],[-121.69,45.37],[-121.7,45.36]]]},"properties":{"name":"Site","note":"Check slope","request":"analysis"}}]}'
          $pkg = "{`"features`":$fc,`"project`":{`"name`":`"Windows Test`"},`"layers`":[`"$($r.id)`"]}"
          Invoke-WebRequest http://localhost:7860/api/handoff -Method Post -ContentType 'application/json' -Body $pkg -OutFile "$env:RUNNER_TEMP\pkg.zip" -UseBasicParsing
          Expand-Archive "$env:RUNNER_TEMP\pkg.zip" "$env:RUNNER_TEMP\pkg"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\pkg" | Select-Object -ExpandProperty Name
          if (-not (Test-Path "$env:RUNNER_TEMP\pkg\shapefile\markups_areas.shp")) { throw "no shapefile" }
          if (-not (Get-ChildItem "$env:RUNNER_TEMP\pkg\layers\*.tif")) { throw "no layer GeoTIFF" }
      - name: Double-clicking again while running just reopens the page
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\Desktop\PM Downloads (1)\earthfetch-studio"
          $out = & "$dir\Start Studio.bat" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'already running') { throw "second launch did not detect the running server" }
